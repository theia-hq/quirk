# cargo-deny policy: the sources allow-list (Track C, release-robustness-spec.md §2) and advisories.
#
# The hand-rolled scripts/lock-guard.sh owns path-drift, sibling rev, and own-version skew. This
# owns the complementary SUPPLY-CHAIN question it does not: no crate may resolve from an
# unexpected git host or registry (a typosquat, a hijacked mirror, an accidental `git = "a-fork"`).
# Only our own siblings (github.com/theia-hq) and crates.io are allowed by source.
#
# bans and licenses stay out of scope. Run: cargo deny check sources advisories
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = ["https://github.com/theia-hq"]

# Advisories against the resolved graph, checked on every push, every pull request and daily
# (.github/workflows/advisories.yml), because an advisory filed against an unchanged lock must still
# turn the build red. This repo locks none of the forks scripts/fork-watch.sh watches in the repos
# that lock them (noq, noq-proto, noq-udp, tokio-rustls-acme), so it runs no fork watch; the day one
# of them enters Cargo.lock, the watch and its rows come with it.
# Nothing is ignored: an advisory that reaches this lock fails the check until it is fixed, or
# ignored here with the reason it does not reach us.
[advisories]
yanked = "deny"
